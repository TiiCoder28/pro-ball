<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pro Ball</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#101923;color:white}header{padding:14px 18px;background:#07111d;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-size:22px;font-weight:800}.pill{background:#1c2c3f;border:1px solid #35516f;border-radius:999px;padding:8px 12px}.current{background:#12311f;border-color:#46d37d;color:#b9ffd0}main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px}.panel{background:#132238;border:1px solid #2b4563;border-radius:16px;padding:14px;box-shadow:0 10px 30px #0005}input,button{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid #36526e;background:#0d1827;color:white}button{cursor:pointer;font-weight:700;background:#1e88e5;border:0}button.secondary{background:#2a3c52}.teams{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.team{min-height:130px;border-radius:14px;padding:10px;background:#0d1827;border:1px solid #2a3e54}.red{border-color:#ff5b5b}.blue{border-color:#5ba4ff}.score{font-size:28px;font-weight:900;text-align:center}.hint{font-size:13px;color:#b8c7d9}canvas{width:100%;max-width:980px;background:#17753d;border-radius:16px;border:3px solid #e9f7ef;display:block;margin:auto}.row{display:flex;gap:8px}.row>*{flex:1}.room{padding:8px;border-radius:10px;background:#0a1524;margin:6px 0;cursor:pointer;border:1px solid transparent}.room.active{border-color:#46d37d;background:#10291d}.error{color:#ffb3b3}.ok{color:#b9ffd0}.share{overflow-wrap:anywhere;line-height:1.3}@media(max-width:850px){main{grid-template-columns:1fr}.teams{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <div class="brand">⚽ Pro Ball</div>
  <div class="pill" id="status">Connecting...</div>
  <div class="pill current" id="currentRoom">No room joined</div>
  <div class="pill">Max 22 players • 11v11</div>
</header>
<main>
  <section class="panel">
    <h2>Room</h2>
    <input id="name" placeholder="Your player name" />
    <input id="roomName" placeholder="Room name" />
    <input id="password" placeholder="Password optional" />
    <div class="row"><button id="create">Create room</button><button class="secondary" id="refresh">Refresh</button></div>
    <input id="roomCode" placeholder="Room code or shared link" />
    <button id="join">Join room</button>
    <p id="msg" class="hint share">Create a room, share the generated link, or join from available rooms.</p>
    <h3>Available rooms</h3><div id="rooms"></div>
    <h3>Controls</h3>
    <p class="hint">Move: W A S D / Arrow keys. Kick: Space. Host can start, pause and reset.</p>
    <div class="row"><button id="start">Start</button><button class="secondary" id="pause">Pause</button><button class="secondary" id="reset">Reset</button></div>
    <h3>Teams</h3>
    <div class="row"><button id="redBtn">Join Red</button><button id="blueBtn">Join Blue</button><button class="secondary" id="specBtn">Spectate</button></div>
  </section>
  <section>
    <div class="panel">
      <div class="score"><span id="redScore">0</span> - <span id="blueScore">0</span> <span class="hint" id="timer">00:00</span></div>
      <canvas id="c" width="980" height="560"></canvas>
    </div>
    <div class="teams">
      <div class="team red"><b>Red</b><div id="redList"></div></div>
      <div class="team blue"><b>Blue</b><div id="blueList"></div></div>
      <div class="team"><b>Spectators</b><div id="specList"></div></div>
    </div>
  </section>
</main>
<script>
const wsUrl = location.protocol === 'https:' ? 'wss://' + location.host + '/ws' : 'ws://' + location.host + '/ws';
let ws, state, field = { w:980, h:560, goalH:150, playerR:15, ballR:9, maxPlayers:22 }, keys = {}, myTeam = 'spectators';
let lastRoomsKey = '', lastPlayersKey = '', lastRoomCode = '', lastScoreKey = '', drawPending = false;
const $ = (id) => document.getElementById(id);
const canvas = $('c');
const ctx = canvas.getContext('2d');
function setText(id, text) { const el = $(id); if (el.textContent !== String(text)) el.textContent = text; }
function log(text, cls='hint') { const msg = $('msg'); if (msg.textContent !== text) msg.textContent = text; msg.className = cls + ' share'; }
function send(message) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(message)); }
function connect() {
  ws = new WebSocket(wsUrl);
  ws.onopen = () => { $('status').textContent = 'Connected'; send({ type:'list' }); };
  ws.onmessage = (event) => {
    const message = JSON.parse(event.data);
    if (message.type === 'state') {
      state = message.state; field = message.field;
      updateCurrentRoom();
      scheduleRender();
      renderRoomsIfChanged(message.rooms);
    }
    if (message.type === 'rooms') renderRoomsIfChanged(message.rooms);
    if (message.type === 'error') log(message.message, 'error');
  };
  ws.onclose = () => { $('status').textContent = 'Disconnected - retrying'; setTimeout(connect, 2000); };
}
function updateCurrentRoom() {
  if (!state || !state.room || state.room === lastRoomCode) return;
  lastRoomCode = state.room;
  setText('currentRoom', 'Current room: ' + state.room);
  const shareLink = location.origin + location.pathname + '?room=' + state.room;
  history.replaceState(null, '', '?room=' + state.room);
  log('Share this link with your players: ' + shareLink, 'ok');
}
function renderRoomsIfChanged(list) {
  const rooms = list || [];
  const key = JSON.stringify(rooms.map(r => [r.id, r.name, r.players, r.locked, r.running, r.id === lastRoomCode]));
  if (key === lastRoomsKey) return;
  lastRoomsKey = key;
  $('rooms').innerHTML = rooms.map((room) => `<button type="button" class="room ${room.id === lastRoomCode ? 'active' : ''}" data-room="${room.id}"><b>${room.name}</b><br><span class="hint">${room.id} • ${room.players}/22 ${room.locked ? '🔒' : ''}${room.id === lastRoomCode ? ' • current' : ''}</span></button>`).join('') || '<p class="hint">No rooms yet</p>';
  for (const button of document.querySelectorAll('.room[data-room]')) button.addEventListener('click', () => $('roomCode').value = button.dataset.room);
}
function playerName() { return $('name').value || 'Player ' + Math.floor(Math.random() * 99); }
$('create').onclick = () => send({ type:'create', name:$('roomName').value, playerName:playerName(), password:$('password').value, team:myTeam });
$('join').onclick = () => { const raw = $('roomCode').value.trim(); const room = (raw.match(/room=([A-Z0-9]+)/) || [])[1] || raw.toUpperCase(); send({ type:'join', room, playerName:playerName(), password:$('password').value, team:myTeam }); };
$('refresh').onclick = () => send({ type:'list' });
$('start').onclick = () => send({ type:'control', action:'start' });
$('pause').onclick = () => send({ type:'control', action:'pause' });
$('reset').onclick = () => send({ type:'control', action:'reset' });
$('redBtn').onclick = () => { myTeam = 'red'; send({ type:'team', team:'red' }); };
$('blueBtn').onclick = () => { myTeam = 'blue'; send({ type:'team', team:'blue' }); };
$('specBtn').onclick = () => { myTeam = 'spectators'; send({ type:'team', team:'spectators' }); };
addEventListener('keydown', (event) => { keys[event.key.toLowerCase()] = true; if (event.code === 'Space') event.preventDefault(); });
addEventListener('keyup', (event) => keys[event.key.toLowerCase()] = false);
setInterval(() => send({ type:'input', up:keys.w||keys.arrowup, down:keys.s||keys.arrowdown, left:keys.a||keys.arrowleft, right:keys.d||keys.arrowright, kick:keys[' ']||keys.space }), 33);
function mm(seconds) { const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60); return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }
function scheduleRender() { if (drawPending) return; drawPending = true; requestAnimationFrame(() => { drawPending = false; render(); }); }
function render() {
  if (!state) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#17753d'; ctx.fillRect(0, 0, 980, 560);
  ctx.strokeStyle = '#e9f7ef'; ctx.lineWidth = 4; ctx.strokeRect(18, 18, 944, 524);
  ctx.beginPath(); ctx.moveTo(490,18); ctx.lineTo(490,542); ctx.stroke();
  ctx.beginPath(); ctx.arc(490,280,72,0,Math.PI*2); ctx.stroke();
  ctx.strokeRect(18,205,90,150); ctx.strokeRect(872,205,90,150);
  ctx.fillStyle = '#0b3a21'; ctx.fillRect(0,205,18,150); ctx.fillRect(962,205,18,150);
  for (const p of Object.values(state.players)) {
    if (p.team === 'spectators') continue;
    ctx.beginPath(); ctx.fillStyle = p.team === 'red' ? '#ff5b5b' : '#5ba4ff'; ctx.arc(p.x,p.y,15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'white'; ctx.font = '11px Arial'; ctx.textAlign = 'center'; ctx.fillText(p.name.slice(0,9), p.x, p.y - 20);
  }
  ctx.beginPath(); ctx.fillStyle='white'; ctx.arc(state.ball.x,state.ball.y,9,0,Math.PI*2); ctx.fill();
  const scoreKey = state.red + ':' + state.blue + ':' + Math.floor(state.time);
  if (scoreKey !== lastScoreKey) { lastScoreKey = scoreKey; setText('redScore', state.red); setText('blueScore', state.blue); setText('timer', mm(state.time)); }
  renderTeamListsIfChanged();
}
function renderTeamListsIfChanged() {
  const players = Object.values(state.players).map(p => [p.id, p.name, p.team]).sort((a,b) => a[0].localeCompare(b[0]));
  const key = JSON.stringify(players);
  if (key === lastPlayersKey) return;
  lastPlayersKey = key;
  const all = Object.values(state.players);
  $('redList').innerHTML = all.filter(p=>p.team==='red').map(p=>'🔴 '+p.name).join('<br>') || '<span class="hint">Empty</span>';
  $('blueList').innerHTML = all.filter(p=>p.team==='blue').map(p=>'🔵 '+p.name).join('<br>') || '<span class="hint">Empty</span>';
  $('specList').innerHTML = all.filter(p=>p.team==='spectators').map(p=>'👀 '+p.name).join('<br>') || '<span class="hint">Empty</span>';
}
connect();
const query = new URLSearchParams(location.search); if (query.get('room')) $('roomCode').value = query.get('room');
</script>
</body>
</html>
