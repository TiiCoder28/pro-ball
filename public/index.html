<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pro Ball</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#101923;color:#fff}header{padding:14px 18px;background:#07111d;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-size:22px;font-weight:800}.pill{background:#1c2c3f;border:1px solid #35516f;border-radius:999px;padding:8px 12px}.current{background:#12311f;border-color:#46d37d;color:#b9ffd0}.musicBtn{width:auto;margin:0;padding:8px 12px;border-radius:999px;background:#2a3c52}main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px}.panel{background:#132238;border:1px solid #2b4563;border-radius:16px;padding:14px}input,button{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid #36526e;background:#0d1827;color:white}button{cursor:pointer;font-weight:700;background:#1e88e5;border:0}button.secondary{background:#2a3c52}button:disabled{opacity:.4;cursor:not-allowed}.teams{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.team{min-height:130px;border-radius:14px;padding:10px;background:#0d1827;border:1px solid #2a3e54}.red{border-color:#ff5b5b}.blue{border-color:#5ba4ff}.score{font-size:28px;font-weight:900;text-align:center}.hint{font-size:13px;color:#b8c7d9}canvas{width:100%;max-width:980px;background:#17753d;border-radius:16px;border:3px solid #e9f7ef;display:block;margin:auto}.row{display:flex;gap:8px}.row>*{flex:1}.room{text-align:left;padding:8px;border-radius:10px;background:#0a1524;margin:6px 0;border:1px solid transparent}.room.active{border-color:#46d37d;background:#10291d}.error{color:#ffb3b3}.ok{color:#b9ffd0}.share{overflow-wrap:anywhere}@media(max-width:850px){main{grid-template-columns:1fr}.teams{grid-template-columns:1fr}}</style></head><body><header><div class="brand">⚽ Pro Ball</div><div class="pill" id="status">Connecting...</div><div class="pill current" id="currentRoom">No room joined</div><div class="pill" id="roleBadge">Not joined</div><button class="musicBtn" id="music" type="button">🎵 Music Off</button><div class="pill">Max 22 players</div></header><main><section class="panel"><h2>Room</h2><input id="name" placeholder="Your player name"><input id="roomName" placeholder="Room name"><input id="password" placeholder="Password optional"><div class="row"><button id="create">Create room</button><button class="secondary" id="refresh">Refresh</button></div><input id="roomCode" placeholder="Room code or shared link"><button id="join">Join room</button><p id="msg" class="hint share">Create a room, share the link, or join an available room.</p><h3>Available rooms</h3><div id="rooms"></div><h3>Controls</h3><p class="hint" id="hostHelp">Only the room creator can start, pause and reset. Join Red or Blue to move.</p><div class="row"><button id="start">Start</button><button class="secondary" id="pause">Pause</button><button class="secondary" id="reset">Reset</button></div><h3>Teams</h3><div class="row"><button id="redBtn">Join Red</button><button id="blueBtn">Join Blue</button><button class="secondary" id="specBtn">Spectate</button></div></section><section><div class="panel"><div class="score"><span id="redScore">0</span> - <span id="blueScore">0</span> <span class="hint" id="timer">00:00</span></div><canvas id="c" width="980" height="560"></canvas></div><div class="teams"><div class="team red"><b>Red</b><div id="redList"></div></div><div class="team blue"><b>Blue</b><div id="blueList"></div></div><div class="team"><b>Spectators</b><div id="specList"></div></div></div></section></main><script>
const wsUrl=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';let key=localStorage.getItem('pbKey');if(!key){key=String(Date.now())+Math.random();localStorage.setItem('pbKey',key)}let ws,state,you=null,keys={},myTeam='spectators',lastRoom='',lastRooms='',lastPlayers='',lastScore='',pending=false,audioCtx=null,musicOn=false,musicTimer=null,beat=0;const $=id=>document.getElementById(id),canvas=$('c'),ctx=canvas.getContext('2d');function txt(id,v){const e=$(id);if(e.textContent!==String(v))e.textContent=v}function log(t,c='hint'){const e=$('msg');if(e.textContent!==t)e.textContent=t;e.className=c+' share'}function send(m){if(ws&&ws.readyState===1){m.clientKey=key;ws.send(JSON.stringify(m))}}function tone(f,d=.1,v=.04){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d)}function musicStep(){const notes=[392,494,587,494,440,523,659,523];tone(notes[beat%notes.length],.12,.035);if(beat%4===0)tone(110,.08,.05);beat++}function toggleMusic(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();musicOn=!musicOn;txt('music',musicOn?'🎵 Music On':'🎵 Music Off');if(musicOn){audioCtx.resume();musicStep();musicTimer=setInterval(musicStep,320)}else{clearInterval(musicTimer);musicTimer=null}}function connect(){ws=new WebSocket(wsUrl);ws.onopen=()=>{txt('status','Connected');send({type:'list'})};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'){state=m.state;you=m.you;roomUi();roleUi();drawSoon();roomsUi(m.rooms)}if(m.type==='rooms')roomsUi(m.rooms);if(m.type==='error')log(m.message,'error')};ws.onclose=()=>{txt('status','Disconnected - retrying');setTimeout(connect,2000)}}function roomUi(){if(!state||!state.room||state.room===lastRoom)return;lastRoom=state.room;lastPlayers='';lastScore='';txt('currentRoom','Current room: '+state.room);const link=location.origin+location.pathname+'?room='+state.room;history.replaceState(null,'','?room='+state.room);log('Share this link with your players: '+link,'ok')}function roleUi(){const host=!!(you&&you.host),team=you&&you.team?you.team:'not joined';txt('roleBadge',(host?'Host • ':'Player • ')+team);['start','pause','reset'].forEach(id=>$(id).disabled=!host);txt('hostHelp',host?'You are the host. You can start, pause and reset.':'Only the room creator can start, pause and reset.')}function roomsUi(list){const rooms=list||[],key2=JSON.stringify(rooms.map(r=>[r.id,r.name,r.players,r.locked,r.running,r.id===lastRoom]));if(key2===lastRooms)return;lastRooms=key2;$('rooms').innerHTML=rooms.map(r=>`<button type="button" class="room ${r.id===lastRoom?'active':''}" data-room="${r.id}"><b>${r.name}</b><br><span class="hint">${r.id} • ${r.players}/22 ${r.locked?'🔒':''}${r.id===lastRoom?' • current':''}</span></button>`).join('')||'<p class="hint">No rooms yet</p>';document.querySelectorAll('.room[data-room]').forEach(b=>b.addEventListener('click',()=>$('roomCode').value=b.dataset.room))}function pname(){return $('name').value||'Player '+Math.floor(Math.random()*99)}$('music').onclick=toggleMusic;$('create').onclick=()=>{myTeam=myTeam==='spectators'?'red':myTeam;send({type:'create',name:$('roomName').value,playerName:pname(),password:$('password').value,team:myTeam})};$('join').onclick=()=>{const raw=$('roomCode').value.trim(),room=(raw.match(/room=([A-Z0-9]+)/)||[])[1]||raw.toUpperCase();send({type:'join',room,playerName:pname(),password:$('password').value,team:myTeam})};$('refresh').onclick=()=>send({type:'list'});$('start').onclick=()=>send({type:'control',action:'start'});$('pause').onclick=()=>send({type:'control',action:'pause'});$('reset').onclick=()=>send({type:'control',action:'reset'});$('redBtn').onclick=()=>{myTeam='red';send({type:'team',team:'red'})};$('blueBtn').onclick=()=>{myTeam='blue';send({type:'team',team:'blue'})};$('specBtn').onclick=()=>{myTeam='spectators';send({type:'team',team:'spectators'})};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);setInterval(()=>send({type:'input',up:keys.w||keys.arrowup,down:keys.s||keys.arrowdown,left:keys.a||keys.arrowleft,right:keys.d||keys.arrowright,kick:keys[' ']||keys.space}),33);function mm(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}function drawSoon(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;draw()})}function draw(){if(!state)return;ctx.clearRect(0,0,980,560);ctx.fillStyle='#17753d';ctx.fillRect(0,0,980,560);ctx.strokeStyle='#e9f7ef';ctx.lineWidth=4;ctx.strokeRect(18,18,944,524);ctx.beginPath();ctx.moveTo(490,18);ctx.lineTo(490,542);ctx.stroke();ctx.beginPath();ctx.arc(490,280,72,0,Math.PI*2);ctx.stroke();ctx.strokeRect(18,205,90,150);ctx.strokeRect(872,205,90,150);ctx.fillStyle='#0b3a21';ctx.fillRect(0,205,18,150);ctx.fillRect(962,205,18,150);Object.values(state.players).forEach(p=>{if(p.team==='spectators')return;ctx.beginPath();ctx.fillStyle=p.team==='red'?'#ff5b5b':'#5ba4ff';ctx.arc(p.x,p.y,15,0,Math.PI*2);ctx.fill();if(you&&p.id===you.id){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()}ctx.fillStyle='white';ctx.font='11px Arial';ctx.textAlign='center';ctx.fillText(p.name.slice(0,9),p.x,p.y-20)});ctx.beginPath();ctx.fillStyle='white';ctx.arc(state.ball.x,state.ball.y,9,0,Math.PI*2);ctx.fill();const score=state.red+':'+state.blue+':'+Math.floor(state.time);if(score!==lastScore){lastScore=score;txt('redScore',state.red);txt('blueScore',state.blue);txt('timer',mm(state.time))}teamsUi()}function teamsUi(){const ps=Object.values(state.players),key3=JSON.stringify(ps.map(p=>[p.id,p.name,p.team,p.host]).sort());if(key3===lastPlayers)return;lastPlayers=key3;const label=(p,i)=>i+' '+p.name+(p.host?' ⭐':'')+(you&&p.id===you.id?' (you)':'');$('redList').innerHTML=ps.filter(p=>p.team==='red').map(p=>label(p,'🔴')).join('<br>')||'<span class="hint">Empty</span>';$('blueList').innerHTML=ps.filter(p=>p.team==='blue').map(p=>label(p,'🔵')).join('<br>')||'<span class="hint">Empty</span>';$('specList').innerHTML=ps.filter(p=>p.team==='spectators').map(p=>label(p,'👀')).join('<br>')||'<span class="hint">Empty</span>'}connect();const q=new URLSearchParams(location.search);if(q.get('room'))$('roomCode').value=q.get('room');
</script></body></html>
